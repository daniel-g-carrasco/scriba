  <inkscape:templateinfo>
    <inkscape:name>Icona di famiglia (Margine)</inkscape:name>
    <inkscape:shortdesc>Icona tonda 512x512 nello stile di famiglia: pagina 1 cerchio scuro per sfondi chiari, pagina 2 cerchio avorio per sfondi scuri. Disegna il soggetto nel livello Soggetto dentro il riquadro 416 delle guide; riempi con le sfumature nominate (corpo-avorio sul cerchio scuro, corpo-scuro sul cerchio avorio; ombra-* per le forme dietro). Niente contorni, niente trasparenza.</inkscape:shortdesc>
    <inkscape:date>2026-10-18</inkscape:date>
    <inkscape:keywords>margine lucciola icona 512 famiglia</inkscape:keywords>
  </inkscape:templateinfo>
