name: Build

# Linux checks and unsigned build artifacts run on pushes and pull requests.
# Publication requires a separately authorised v* tag, never a main push or PR.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/test.yml

  flatpak:
    needs: test
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        run: |
          flatpak-builder --disable-rofiles-fuse --force-clean --ccache=false --repo=repo \
            build-dir build-aux/flatpak/io.github.daniel_g_carrasco.scriba.yaml
          flatpak build-bundle repo scriba.flatpak io.github.daniel_g_carrasco.scriba stable \
            --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo
      - name: Check the package with Platform, without the SDK
        run: |
          flatpak info org.gnome.Platform//50
          flatpak build --runtime build-dir python3 /app/share/scriba/check_flatpak.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: scriba-flatpak
          path: scriba.flatpak

  release:
    if: github.event_name != 'pull_request' && startsWith(github.ref, 'refs/tags/v')
    needs: [test, flatpak]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: scriba-flatpak
      - name: Sign the bundle (minisign), checked before anything is uploaded
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          PUBLIC_KEY: RWRF+AifJvn/zhz0o7MBObIYHgw9+sWoc4GaBK+qYnJY0AqeJm540y0a
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq minisign
          key="$RUNNER_TEMP/minisign.key"
          (umask 077
           case "$MINISIGN_SECRET_KEY" in
             "untrusted comment:"*) printf '%s\n' "$MINISIGN_SECRET_KEY" ;;
             *) printf 'untrusted comment: releases\n%s\n' "$MINISIGN_SECRET_KEY" ;;
           esac | tr -d '\r' > "$key")
          f=scriba.flatpak
          minisign -S -s "$key" -m "$f" -x "$f.minisig" -t "timestamp:$(date +%s) file:$f hashed" </dev/null
          minisign -V -P "$PUBLIC_KEY" -m "$f" -x "$f.minisig"
          rm -f "$key"
      - name: The release, a draft, with the Flatpak
        # made here if it is not there yet (a job run again finds it), never
        # published here: see the next step
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1 ||
            gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --draft \
              --title "Scriba ${GITHUB_REF_NAME#v}" --generate-notes
          gh release upload "${GITHUB_REF_NAME}" scriba.flatpak scriba.flatpak.minisig \
            --repo "${GITHUB_REPOSITORY}" --clobber
      - name: Published when every file is there
        # release-complete: the same step, word for word, in build.yml and in
        # windows.yml (tests/test_release.py compares them and runs it). The
        # release is a draft until the Flatpak, the installer and the zip are
        # all there with their signatures: the installed app asks GitHub for
        # the latest release, and a draft is never that. Whichever workflow
        # ends last finds every file and publishes.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          names="$(gh release view "$tag" --repo "${GITHUB_REPOSITORY}" --json assets --jq '.assets[].name')"
          missing=""
          for wanted in '\.flatpak$' '\.flatpak\.minisig$' \
                        "-setup-${tag}-windows-x64\.exe$" "-setup-${tag}-windows-x64\.exe\.minisig$" \
                        "-${tag}-windows-x64-portable\.zip$" "-${tag}-windows-x64-portable\.zip\.minisig$"; do
            echo "$names" | grep -Eq -- "$wanted" || missing="$missing $wanted"
          done
          if [ -n "$missing" ]; then
            echo "the release stays a draft, still missing:$missing"
          else
            gh release edit "$tag" --repo "${GITHUB_REPOSITORY}" --draft=false --latest
            echo "release $tag published: every file is there"
          fi
